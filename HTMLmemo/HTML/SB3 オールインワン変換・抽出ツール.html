<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB3 All-in-One Extractor & Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5em;
            margin-top: 0;
            color: #2c3e50;
        }
        .description {
            font-size: 0.9em;
            line-height: 1.6;
            background: #eef2f5;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        label {
            font-weight: bold;
            font-size: 0.9em;
            width: 200px;
            flex-shrink: 0;
        }
        input[type="text"], input[type="file"] {
            flex-grow: 1;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #732d91;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            padding: 15px;
            background-color: #fef9e7;
            border-left: 4px solid #f1c40f;
            font-size: 0.9em;
            white-space: pre-wrap;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #ecf0f1;
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background-color: #8e44ad;
            width: 0%;
            transition: width 0.2s;
        }
        #jsonPreview {
            width: 100%;
            height: 200px;
            margin-top: 20px;
            padding: 10px;
            box-sizing: border-box;
            background-color: #282c34;
            color: #abb2bf;
            border: none;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-y: auto;
            display: none;
        }
        h3 {
            margin-bottom: 5px;
            font-size: 1.1em;
            display: none;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SB3 オールインワン変換・抽出ツール</h1>
    <div class="description">
        <b>機能:</b><br>
        1. <code>project.json</code> の抽出と画面プレビュー<br>
        2. <b>SVG</b> → <b>PNG</b> への一括変換＆フォルダ格納<br>
        3. <b>WAV</b> → <b>MP3</b> への一括変換＆フォルダ格納<br>
        上記すべてを整理した状態で、ひとつのZIPファイルとして出力します。
    </div>

    <div class="form-group">
        <label for="fileInput">ファイルを選択:</label>
        <input type="file" id="fileInput" accept=".sb3,.ssb3,.zip">
    </div>

    <div class="form-group">
        <label for="imgFolder">画像保存フォルダ名:</label>
        <input type="text" id="imgFolder" value="images">
    </div>

    <div class="form-group">
        <label for="audioFolder">音声保存フォルダ名:</label>
        <input type="text" id="audioFolder" value="audio">
    </div>

    <div class="form-group">
        <label for="zipName">出力ZIPファイル名:</label>
        <input type="text" id="zipName" value="sb3_extracted_all.zip">
    </div>

    <button id="processBtn" disabled>すべて変換してZIPをダウンロード</button>

    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="status"></div>

    <h3 id="previewTitle">JSON プレビュー</h3>
    <textarea id="jsonPreview" readonly></textarea>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const imgFolderInput = document.getElementById('imgFolder');
    const audioFolderInput = document.getElementById('audioFolder');
    const zipNameInput = document.getElementById('zipName');
    const processBtn = document.getElementById('processBtn');
    
    const statusDiv = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const jsonPreview = document.getElementById('jsonPreview');
    const previewTitle = document.getElementById('previewTitle');

    fileInput.addEventListener('change', () => {
        processBtn.disabled = fileInput.files.length === 0;
    });

    function updateStatus(message, showProgress = false, percent = 0) {
        statusDiv.style.display = 'block';
        statusDiv.textContent = message;
        if (showProgress) {
            progressBar.style.display = 'block';
            progressFill.style.width = percent + '%';
        } else {
            progressBar.style.display = 'none';
        }
    }

    /* --- SVG → PNG 変換処理 --- */
    function convertSvgToPngBlob(svgText, filename) {
        return new Promise((resolve, reject) => {
            const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth || img.width || 480;
                canvas.height = img.naturalHeight || img.height || 360;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                canvas.toBlob((pngBlob) => pngBlob ? resolve(pngBlob) : reject(new Error("Canvas変換エラー")), 'image/png');
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error(`画像読み込みエラー: ${filename}`));
            };
            img.src = url;
        });
    }

    /* --- WAV → MP3 変換処理 --- */
    function floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
            let s = Math.max(-1, Math.min(1, input[i]));
            output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return output;
    }

    async function convertWavToMp3(arrayBuffer, audioCtx) {
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const channels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
        const mp3Data = [];
        const left = audioBuffer.getChannelData(0);
        const right = channels > 1 ? audioBuffer.getChannelData(1) : new Float32Array(left.length);
        const sampleBlockSize = 1152;

        for (let i = 0; i < left.length; i += sampleBlockSize) {
            const leftChunk = left.subarray(i, i + sampleBlockSize);
            const rightChunk = right.subarray(i, i + sampleBlockSize);
            const leftInt16 = floatTo16BitPCM(leftChunk);
            const rightInt16 = floatTo16BitPCM(rightChunk);
            const mp3buf = channels === 2 ? mp3encoder.encodeBuffer(leftInt16, rightInt16) : mp3encoder.encodeBuffer(leftInt16);
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }
        const mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) mp3Data.push(mp3buf);

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    /* --- メイン処理 --- */
    processBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        const imgFolder = imgFolderInput.value.trim() || 'images';
        const audioFolder = audioFolderInput.value.trim() || 'audio';
        let zipFileName = zipNameInput.value.trim() || 'sb3_extracted_all.zip';
        if (!zipFileName.endsWith('.zip')) zipFileName += '.zip';

        processBtn.disabled = true;
        jsonPreview.style.display = 'none';
        previewTitle.style.display = 'none';

        try {
            updateStatus('SB3ファイルを解析中...', true, 5);
            const loadedZip = await JSZip.loadAsync(file);
            const outputZip = new JSZip();
            
            // フォルダの準備
            const folderImg = outputZip.folder(imgFolder);
            const folderAudio = outputZip.folder(audioFolder);

            // ファイルリストの分類
            const files = Object.keys(loadedZip.files);
            const jsonFiles = files.filter(f => f.endsWith('.json'));
            const svgFiles = files.filter(f => f.endsWith('.svg'));
            const audioFiles = files.filter(f => f.endsWith('.wav') || f.endsWith('.mp3'));
            
            const totalTasks = jsonFiles.length + svgFiles.length + audioFiles.length;
            let completedTasks = 0;

            const updateProgress = (name) => {
                completedTasks++;
                const percent = Math.floor((completedTasks / totalTasks) * 100);
                updateStatus(`処理中 (${completedTasks}/${totalTasks}): ${name}`, true, percent);
            };

            // 1. JSONの処理
            for (const jsonName of jsonFiles) {
                const jsonContent = await loadedZip.files[jsonName].async("string");
                outputZip.file(jsonName, jsonContent);
                
                if (jsonName === 'project.json') {
                    previewTitle.style.display = 'block';
                    jsonPreview.style.display = 'block';
                    try {
                        jsonPreview.value = JSON.stringify(JSON.parse(jsonContent), null, 2);
                    } catch {
                        jsonPreview.value = jsonContent;
                    }
                }
                updateProgress(jsonName);
            }

            // 2. 画像(SVG)の処理
            for (const svgName of svgFiles) {
                try {
                    const svgText = await loadedZip.files[svgName].async("string");
                    const pngBlob = await convertSvgToPngBlob(svgText, svgName);
                    const newName = svgName.split('/').pop().replace(/\.svg$/i, '') + '.png';
                    folderImg.file(newName, pngBlob);
                } catch (e) {
                    console.warn(`スキップ: ${svgName}`, e);
                }
                updateProgress(svgName);
            }

            // 3. 音声(WAV/MP3)の処理
            // ユーザーアクション（クリック）内でAudioContextを初期化
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            for (const audioName of audioFiles) {
                try {
                    const fileData = await loadedZip.files[audioName].async("arraybuffer");
                    if (audioName.endsWith('.wav')) {
                        const mp3Blob = await convertWavToMp3(fileData, audioCtx);
                        const newName = audioName.split('/').pop().replace(/\.wav$/i, '') + '.mp3';
                        folderAudio.file(newName, mp3Blob);
                    } else {
                        // 最初からMP3の場合
                        folderAudio.file(audioName.split('/').pop(), fileData);
                    }
                } catch (e) {
                    console.warn(`スキップ: ${audioName}`, e);
                }
                updateProgress(audioName);
            }
            
            // AudioContextを閉じてメモリ解放
            if (audioCtx.state !== 'closed') audioCtx.close();

            // 4. 新しいZIPの生成とダウンロード
            updateStatus('すべての変換が完了しました。ZIPファイルを圧縮中...', true, 100);
            
            const zipContent = await outputZip.generateAsync({ type: 'blob' });
            const downloadUrl = URL.createObjectURL(zipContent);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = zipFileName;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);

            updateStatus(`処理完了！\n・画像: ${svgFiles.length}枚\n・音声: ${audioFiles.length}個\nを変換・抽出し「${zipFileName}」としてダウンロードしました。`, false);

        } catch (error) {
            console.error(error);
            updateStatus(`エラーが発生しました: ${error.message}`, false);
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
