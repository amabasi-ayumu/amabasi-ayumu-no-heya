<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品一覧</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #f4f6f8;
        }
        .item-name {
            text-align: left;
        }
        /* 個数入力欄（スピンボタン付き）の幅を調整 */
        input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: right;
        }
        /* チェックボックスとラベルを押しやすくする */
        label {
            cursor: pointer;
            display: block;
        }
        .submit-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>商品一覧</h2>

    <form action="#" method="POST">
        <table>
            <thead>
                <tr>
                    <th>選択</th>
                    <th>商品名</th>
                    <th>単価</th>
                    <th>個数</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input type="checkbox" name="selected_items[]" value="item1" id="chk_item1">
                    </td>
                    <td class="item-name">
                        <label for="chk_item1">商品 1</label>
                    </td>
                    <td>¥1,000</td>
                    <td>
                        <input type="number" name="qty_item1" min="1" value="1">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="checkbox" name="selected_items[]" value="item2" id="chk_item2">
                    </td>
                    <td class="item-name">
                        <label for="chk_item2">商品 2</label>
                    </td>
                    <td>¥2,500</td>
                    <td>
                        <input type="number" name="qty_item2" min="1" value="1">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="checkbox" name="selected_items[]" value="item3" id="chk_item3">
                    </td>
                    <td class="item-name">
                        <label for="chk_item3">商品 3</label>
                    </td>
                    <td>¥800</td>
                    <td>
                        <input type="number" name="qty_item3" min="1" value="1">
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="button" class="submit-btn" onclick="alert('選択した商品をカートに追加しました（※テスト動作）')">カートに入れる</button>
    </form>

</body>
</html>
