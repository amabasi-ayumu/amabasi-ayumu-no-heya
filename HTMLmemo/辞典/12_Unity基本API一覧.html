<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>C# Unity基本API一覧 の意味</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101827; color: #e5edf7; font-family: system-ui, "Yu Gothic", Meiryo, sans-serif; }
        .header { padding: 38px max(24px, calc((100vw - 1150px) / 2)); background: #18253a; border-bottom: 1px solid #334155; }
        .header-title { margin: 0 0 12px; font-size: 2rem; }
        .header-desc { color: #b8c7dc; line-height: 1.7; margin: 0; }
        .wrap { max-width: 1150px; margin: auto; padding: 24px; }
        .back-link { color: #8fcbff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .tools { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .search-input { background: #1d2b40; color: white; border: 1px solid #46566d; border-radius: 9px; padding: 13px; flex: 1; min-width: 210px; font-size: 1rem; }
        .count { color: #aabbd0; }
        .btn-print { background: #293e58; border: 1px solid #536780; color: white; border-radius: 8px; padding: 11px; cursor: pointer; font-size: 1rem; }
        .btn-print:hover { background: #354e6e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: #1b293c; border: 1px solid #35465e; border-radius: 14px; padding: 20px; min-width: 0; }
        .card-symbol { font-size: 1.55rem; color: #8fcbff; font-family: Consolas, monospace; font-weight: bold; }
        .card-title { font-size: 1rem; margin: 5px 0 18px; color: #dbe8f8; }
        .code-label { display: block; color: #a8bad0; font-size: .8rem; margin: 14px 0 6px; }
        .code-block { background: #0e1725; border-radius: 8px; padding: 11px 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0; font-size: .92rem; }
        @media print {
            body { background: white; color: black; }
            .header, .card { background: white; color: black; border-color: #ccc; }
            .code-block { background: #f1f3f5; color: black; border: 1px solid #ddd; }
            .tools { display: none; }
            .cards { grid-template-columns: repeat(2, 1fr); }
            .card { break-inside: avoid; }
            .card-symbol { color: #173e6b; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">C# Unity基本API一覧 の意味</h1>
        <p class="header-desc">意味：言葉の意味 ／ 詳細：正確な役割 ／ コード例：C#コードと日本語での読み方</p>
    </header>
    <main class="wrap">
        <p><a href="index.html" class="back-link">← 一覧目次</a></p>
        <div class="tools">
            <input id="search" class="search-input" placeholder="名称・意味・詳細・コード例から検索" aria-label="検索">
            <span class="count" id="count"></span>
            <button class="btn-print" onclick="window.print()">印刷</button>
        </div>
        <section class="cards" id="cards"></section>
    </main>
    <script>
        const data = [{"symbol": "Awake", "title": "Awake", "meaning": "スクリプトインスタンス初期化時", "detail": "有効化状態やロード状況に注意", "example": "void Awake() { }", "reading": "Awakeという処理を定義する。スクリプトインスタンス初期化時に対応する。"}, {"symbol": "OnEnable", "title": "OnEnable", "meaning": "コンポーネントが有効になった時", "detail": "イベント購読に使用", "example": "void OnEnable() { }", "reading": "OnEnableという処理を定義する。コンポーネントが有効になった時に対応する。"}, {"symbol": "Start", "title": "Start", "meaning": "初回Update前に呼ばれる", "detail": "有効なコンポーネントで実行", "example": "void Start() { }", "reading": "Startという処理を定義する。初回Update前に呼ばれるに対応する。"}, {"symbol": "Update", "title": "Update", "meaning": "フレームごとに呼ばれる", "detail": "Time.deltaTimeを活用", "example": "void Update() { }", "reading": "Updateという処理を定義する。フレームごとに呼ばれるに対応する。"}, {"symbol": "FixedUpdate", "title": "FixedUpdate", "meaning": "固定時間刻みの更新", "detail": "物理更新に使用", "example": "void FixedUpdate() { }", "reading": "FixedUpdateという処理を定義する。固定時間刻みの更新に対応する。"}, {"symbol": "LateUpdate", "title": "LateUpdate", "meaning": "Update後の更新", "detail": "カメラ追従など", "example": "void LateUpdate() { }", "reading": "LateUpdateという処理を定義する。Update後の更新に対応する。"}, {"symbol": "OnDisable", "title": "OnDisable", "meaning": "無効化時", "detail": "イベント購読解除に使用", "example": "void OnDisable() { }", "reading": "OnDisableという処理を定義する。無効化時に対応する。"}, {"symbol": "OnDestroy", "title": "OnDestroy", "meaning": "破棄時", "detail": "破棄処理", "example": "void OnDestroy() { }", "reading": "OnDestroyという処理を定義する。破棄時に対応する。"}, {"symbol": "GetComponent", "title": "GetComponent", "meaning": "指定コンポーネント取得", "detail": "未取得ならnull", "example": "var rb = GetComponent<Rigidbody>();", "reading": "GetComponent<Rigidbody>()の結果をrbに代入する。"}, {"symbol": "TryGetComponent", "title": "TryGetComponent", "meaning": "取得成否を返す", "detail": "boolを返す", "example": "bool ok = TryGetComponent(out Rigidbody rb);", "reading": "TryGetComponent(out Rigidbody rb)の結果をokに代入する。"}, {"symbol": "AddComponent", "title": "AddComponent", "meaning": "コンポーネント追加", "detail": "追加可能な型のみ", "example": "gameObject.AddComponent<BoxCollider>();", "reading": "このコードでは「コンポーネント追加」というAddComponentの役割を使う。"}, {"symbol": "SetActive", "title": "SetActive", "meaning": "GameObjectの有効状態変更", "detail": "階層の有効状態に影響", "example": "gameObject.SetActive(false);", "reading": "このコードでは「GameObjectの有効状態変更」というSetActiveの役割を使う。"}, {"symbol": "Instantiate", "title": "Instantiate", "meaning": "オブジェクト複製", "detail": "元オブジェクトを複製", "example": "var clone = Instantiate(prefab);", "reading": "Instantiate(prefab)の結果をcloneに代入する。"}, {"symbol": "Destroy", "title": "Destroy", "meaning": "オブジェクト破棄を予約", "detail": "通常フレーム後に破棄", "example": "Destroy(gameObject);", "reading": "このコードでは「オブジェクト破棄を予約」というDestroyの役割を使う。"}, {"symbol": "Debug.Log", "title": "Debug.Log", "meaning": "コンソールへ出力", "detail": "本番ログ量に注意", "example": "Debug.Log(\"Hello\");", "reading": "このコードでは「コンソールへ出力」というDebug.Logの役割を使う。"}, {"symbol": "Time.deltaTime", "title": "Time.deltaTime", "meaning": "前フレームからの経過時間", "detail": "フレーム時間", "example": "float dt = Time.deltaTime;", "reading": "Time.deltaTimeの結果をdtに代入する。"}];

        const cards = document.getElementById('cards'),
              search = document.getElementById('search'),
              count = document.getElementById('count');

        function esc(s) {
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function render() {
            const q = search.value.toLowerCase().trim();
            const filtered = data.filter(x => Object.values(x).join(' ').toLowerCase().includes(q));
            count.textContent = filtered.length + ' / ' + data.length + ' 件';
            cards.innerHTML = filtered.map(x => `
                <article class="card">
                    <span class="card-symbol">${esc(x.symbol)}</span>
                    <h3 class="card-title">${esc(x.title)}</h3>
                    <small class="code-label">意味</small>
                    <pre class="code-block"><code>${esc(x.meaning)}</code></pre>
                    <small class="code-label">詳細</small>
                    <pre class="code-block"><code>${esc(x.detail)}</code></pre>
                    <small class="code-label">コード例　${esc(x.example)}</small>
                    <pre class="code-block"><code>${esc(x.reading)}</code></pre>
                </article>
            `).join('');
        }
        search.addEventListener('input', render);
        render();
    </script>
</body>
</html>
