<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>C# 演算子一覧 の意味</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101827; color: #e5edf7; font-family: system-ui, "Yu Gothic", Meiryo, sans-serif; }
        .header { padding: 38px max(24px, calc((100vw - 1150px) / 2)); background: #18253a; border-bottom: 1px solid #334155; }
        .header-title { margin: 0 0 12px; font-size: 2rem; }
        .header-desc { color: #b8c7dc; line-height: 1.7; margin: 0; }
        .wrap { max-width: 1150px; margin: auto; padding: 24px; }
        .back-link { color: #8fcbff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .tools { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .search-input { background: #1d2b40; color: white; border: 1px solid #46566d; border-radius: 9px; padding: 13px; flex: 1; min-width: 210px; font-size: 1rem; }
        .count { color: #aabbd0; }
        .btn-print { background: #293e58; border: 1px solid #536780; color: white; border-radius: 8px; padding: 11px; cursor: pointer; font-size: 1rem; }
        .btn-print:hover { background: #354e6e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: #1b293c; border: 1px solid #35465e; border-radius: 14px; padding: 20px; min-width: 0; }
        .card-symbol { font-size: 1.55rem; color: #8fcbff; font-family: Consolas, monospace; font-weight: bold; }
        .card-title { font-size: 1rem; margin: 5px 0 18px; color: #dbe8f8; }
        .code-label { display: block; color: #a8bad0; font-size: .8rem; margin: 14px 0 6px; }
        .code-block { background: #0e1725; border-radius: 8px; padding: 11px 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0; font-size: .92rem; }
        @media print {
            body { background: white; color: black; }
            .header, .card { background: white; color: black; border-color: #ccc; }
            .code-block { background: #f1f3f5; color: black; border: 1px solid #ddd; }
            .tools { display: none; }
            .cards { grid-template-columns: repeat(2, 1fr); }
            .card { break-inside: avoid; }
            .card-symbol { color: #173e6b; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">C# 演算子一覧 の意味</h1>
        <p class="header-desc">意味：言葉の意味 ／ 詳細：正確な役割 ／ コード例：C#コードと日本語での読み方</p>
    </header>
    <main class="wrap">
        <p><a href="index.html" class="back-link">← 一覧目次</a></p>
        <div class="tools">
            <input id="search" class="search-input" placeholder="名称・意味・詳細・コード例から検索" aria-label="検索">
            <span class="count" id="count"></span>
            <button class="btn-print" onclick="window.print()">印刷</button>
        </div>
        <section class="cards" id="cards"></section>
    </main>
    <script>
        const data = [{"symbol": "+", "title": "+", "meaning": "加算・文字列連結", "detail": "型により動作が変わる", "example": "int n = 2 + 3;", "reading": "2 + 3の結果をnに代入する。"}, {"symbol": "-", "title": "-", "meaning": "減算・符号反転", "detail": "単項演算子にもなる", "example": "int n = 5 - 2;", "reading": "5 - 2の結果をnに代入する。"}, {"symbol": "*", "title": "*", "meaning": "乗算", "detail": "unsafeではポインター記法にも使用", "example": "int n = 2 * 3;", "reading": "2 * 3の結果をnに代入する。"}, {"symbol": "/", "title": "/", "meaning": "除算", "detail": "整数同士なら整数除算", "example": "int n = 5 / 2;", "reading": "5 / 2の結果をnに代入する。"}, {"symbol": "%", "title": "%", "meaning": "剰余", "detail": "負数の符号に注意", "example": "int n = 5 % 2;", "reading": "5 % 2の結果をnに代入する。"}, {"symbol": "==", "title": "==", "meaning": "等価比較", "detail": "型によって等価の定義が異なる", "example": "bool b = x == y;", "reading": "x == yの結果をbに代入する。"}, {"symbol": "!=", "title": "!=", "meaning": "非等価比較", "detail": "不一致", "example": "bool b = x != y;", "reading": "x != yの結果をbに代入する。"}, {"symbol": "&&", "title": "&&", "meaning": "条件付き論理AND", "detail": "短絡評価", "example": "if (a && b) { }", "reading": "条件が真のときだけ処理する。"}, {"symbol": "||", "title": "||", "meaning": "条件付き論理OR", "detail": "短絡評価", "example": "if (a || b) { }", "reading": "条件が真のときだけ処理する。"}, {"symbol": "!", "title": "!", "meaning": "論理否定・null免除", "detail": "式末尾の!はnull許容解析への指定", "example": "bool b = !ready;", "reading": "!readyの結果をbに代入する。"}, {"symbol": "??", "title": "??", "meaning": "null合体", "detail": "左辺がnullなら右辺", "example": "string s = name ?? \"未設定\";", "reading": "name ?? \"未設定\"の結果をsに代入する。"}, {"symbol": "??=", "title": "??=", "meaning": "null合体代入", "detail": "nullの場合のみ代入", "example": "name ??= \"未設定\";", "reading": "このコードでは「null合体代入」という??=の役割を使う。"}, {"symbol": "?.", "title": "?.", "meaning": "null条件付きメンバーアクセス", "detail": "nullならアクセスしない", "example": "int? n = obj?.Count;", "reading": "obj?.Countの結果をnに代入する。"}, {"symbol": "=>", "title": "=>", "meaning": "ラムダ演算子・式形式メンバー", "detail": "switch式の腕にも使う", "example": "Func<int,int> f = x => x * 2;", "reading": "x => x * 2の結果をfに代入する。"}, {"symbol": "^", "title": "^", "meaning": "ビットXOR・末尾からのIndex", "detail": "a[^1]は末尾要素", "example": "int n = 5 ^ 3;", "reading": "5 ^ 3の結果をnに代入する。"}, {"symbol": "..", "title": "..", "meaning": "範囲演算子", "detail": "終端は含まない", "example": "var sub = a[1..3];", "reading": "a[1..3]の結果をsubに代入する。"}, {"symbol": "<<", "title": "<<", "meaning": "左ビットシフト", "detail": "ビットを左へ", "example": "int n = 1 << 3;", "reading": "1 << 3の結果をnに代入する。"}, {"symbol": ">>", "title": ">>", "meaning": "右ビットシフト", "detail": "符号付きの挙動に注意", "example": "int n = 8 >> 1;", "reading": "8 >> 1の結果をnに代入する。"}, {"symbol": "is", "title": "is", "meaning": "型・パターン検査", "detail": "パターン変数を宣言可能", "example": "if (obj is string s) { }", "reading": "条件が真のときだけ処理する。"}, {"symbol": "as", "title": "as", "meaning": "参照/nullable型への安全な変換", "detail": "変換できなければnull", "example": "var s = obj as string;", "reading": "obj as stringの結果をsに代入する。"}];

        const cards = document.getElementById('cards'),
              search = document.getElementById('search'),
              count = document.getElementById('count');

        function esc(s) {
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function render() {
            const q = search.value.toLowerCase().trim();
            const filtered = data.filter(x => Object.values(x).join(' ').toLowerCase().includes(q));
            count.textContent = filtered.length + ' / ' + data.length + ' 件';
            cards.innerHTML = filtered.map(x => `
                <article class="card">
                    <span class="card-symbol">${esc(x.symbol)}</span>
                    <h3 class="card-title">${esc(x.title)}</h3>
                    <small class="code-label">意味</small>
                    <pre class="code-block"><code>${esc(x.meaning)}</code></pre>
                    <small class="code-label">詳細</small>
                    <pre class="code-block"><code>${esc(x.detail)}</code></pre>
                    <small class="code-label">コード例　${esc(x.example)}</small>
                    <pre class="code-block"><code>${esc(x.reading)}</code></pre>
                </article>
            `).join('');
        }
        search.addEventListener('input', render);
        render();
    </script>
</body>
</html>
