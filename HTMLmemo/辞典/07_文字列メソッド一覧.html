<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>C# 文字列メソッド一覧 の意味</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101827; color: #e5edf7; font-family: system-ui, "Yu Gothic", Meiryo, sans-serif; }
        .header { padding: 38px max(24px, calc((100vw - 1150px) / 2)); background: #18253a; border-bottom: 1px solid #334155; }
        .header-title { margin: 0 0 12px; font-size: 2rem; }
        .header-desc { color: #b8c7dc; line-height: 1.7; margin: 0; }
        .wrap { max-width: 1150px; margin: auto; padding: 24px; }
        .back-link { color: #8fcbff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .tools { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .search-input { background: #1d2b40; color: white; border: 1px solid #46566d; border-radius: 9px; padding: 13px; flex: 1; min-width: 210px; font-size: 1rem; }
        .count { color: #aabbd0; }
        .btn-print { background: #293e58; border: 1px solid #536780; color: white; border-radius: 8px; padding: 11px; cursor: pointer; font-size: 1rem; }
        .btn-print:hover { background: #354e6e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: #1b293c; border: 1px solid #35465e; border-radius: 14px; padding: 20px; min-width: 0; }
        .card-symbol { font-size: 1.55rem; color: #8fcbff; font-family: Consolas, monospace; font-weight: bold; }
        .card-title { font-size: 1rem; margin: 5px 0 18px; color: #dbe8f8; }
        .code-label { display: block; color: #a8bad0; font-size: .8rem; margin: 14px 0 6px; }
        .code-block { background: #0e1725; border-radius: 8px; padding: 11px 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0; font-size: .92rem; }
        @media print {
            body { background: white; color: black; }
            .header, .card { background: white; color: black; border-color: #ccc; }
            .code-block { background: #f1f3f5; color: black; border: 1px solid #ddd; }
            .tools { display: none; }
            .cards { grid-template-columns: repeat(2, 1fr); }
            .card { break-inside: avoid; }
            .card-symbol { color: #173e6b; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">C# 文字列メソッド一覧 の意味</h1>
        <p class="header-desc">意味：言葉の意味 ／ 詳細：正確な役割 ／ コード例：C#コードと日本語での読み方</p>
    </header>
    <main class="wrap">
        <p><a href="index.html" class="back-link">← 一覧目次</a></p>
        <div class="tools">
            <input id="search" class="search-input" placeholder="名称・意味・詳細・コード例から検索" aria-label="検索">
            <span class="count" id="count"></span>
            <button class="btn-print" onclick="window.print()">印刷</button>
        </div>
        <section class="cards" id="cards"></section>
    </main>
    <script>
        const data = [{"symbol": "Length", "title": "Length", "meaning": "文字列のUTF-16コード単位数", "detail": "Unicodeの文字数と異なる場合あり", "example": "int n = text.Length;", "reading": "textの長さを取得してnに入れる。"}, {"symbol": "Contains", "title": "Contains", "meaning": "指定文字列を含むか", "detail": "大文字小文字の扱いに注意", "example": "bool b = text.Contains(\"abc\");", "reading": "指定した文字列が含まれるか調べてbに入れる。"}, {"symbol": "StartsWith", "title": "StartsWith", "meaning": "指定文字列で始まるか", "detail": "比較方式を指定可能", "example": "bool b = text.StartsWith(\"A\");", "reading": "指定した文字列で始まるか調べてbに入れる。"}, {"symbol": "EndsWith", "title": "EndsWith", "meaning": "指定文字列で終わるか", "detail": "比較方式を指定可能", "example": "bool b = text.EndsWith(\"Z\");", "reading": "指定した文字列で終わるか調べてbに入れる。"}, {"symbol": "IndexOf", "title": "IndexOf", "meaning": "最初の出現位置を探す", "detail": "未発見なら-1", "example": "int i = text.IndexOf(\"a\");", "reading": "text.IndexOf(\"a\")の結果をiに代入する。"}, {"symbol": "LastIndexOf", "title": "LastIndexOf", "meaning": "最後の出現位置を探す", "detail": "未発見なら-1", "example": "int i = text.LastIndexOf(\"a\");", "reading": "text.LastIndexOf(\"a\")の結果をiに代入する。"}, {"symbol": "Substring", "title": "Substring", "meaning": "部分文字列を取得", "detail": "範囲外で例外", "example": "string s = text.Substring(1, 3);", "reading": "text.Substring(1, 3)の結果をsに代入する。"}, {"symbol": "Replace", "title": "Replace", "meaning": "一致部分を置換", "detail": "元の文字列は変更されない", "example": "string s = text.Replace(\"a\", \"b\");", "reading": "text.Replace(\"a\", \"b\")の結果をsに代入する。"}, {"symbol": "Split", "title": "Split", "meaning": "区切りで分割", "detail": "空要素の扱いを指定可能", "example": "string[] a = text.Split(',');", "reading": "text.Split(',')の結果をaに代入する。"}, {"symbol": "Trim", "title": "Trim", "meaning": "両端の空白等を除去", "detail": "新しい文字列を返す", "example": "string s = text.Trim();", "reading": "text.Trim()の結果をsに代入する。"}, {"symbol": "ToUpper", "title": "ToUpper", "meaning": "大文字に変換", "detail": "カルチャー差に注意", "example": "string s = text.ToUpperInvariant();", "reading": "text.ToUpperInvariant()の結果をsに代入する。"}, {"symbol": "ToLower", "title": "ToLower", "meaning": "小文字に変換", "detail": "カルチャー差に注意", "example": "string s = text.ToLowerInvariant();", "reading": "text.ToLowerInvariant()の結果をsに代入する。"}, {"symbol": "IsNullOrEmpty", "title": "IsNullOrEmpty", "meaning": "nullまたは空文字を判定", "detail": "staticメソッド", "example": "bool b = string.IsNullOrEmpty(text);", "reading": "string.IsNullOrEmpty(text)の結果をbに代入する。"}, {"symbol": "IsNullOrWhiteSpace", "title": "IsNullOrWhiteSpace", "meaning": "null/空白のみを判定", "detail": "staticメソッド", "example": "bool b = string.IsNullOrWhiteSpace(text);", "reading": "string.IsNullOrWhiteSpace(text)の結果をbに代入する。"}, {"symbol": "Join", "title": "Join", "meaning": "要素を区切り文字で結合", "detail": "staticメソッド", "example": "string s = string.Join(\",\", values);", "reading": "string.Join(\",\", values)の結果をsに代入する。"}];

        const cards = document.getElementById('cards'),
              search = document.getElementById('search'),
              count = document.getElementById('count');

        function esc(s) {
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function render() {
            const q = search.value.toLowerCase().trim();
            const filtered = data.filter(x => Object.values(x).join(' ').toLowerCase().includes(q));
            count.textContent = filtered.length + ' / ' + data.length + ' 件';
            cards.innerHTML = filtered.map(x => `
                <article class="card">
                    <span class="card-symbol">${esc(x.symbol)}</span>
                    <h3 class="card-title">${esc(x.title)}</h3>
                    <small class="code-label">意味</small>
                    <pre class="code-block"><code>${esc(x.meaning)}</code></pre>
                    <small class="code-label">詳細</small>
                    <pre class="code-block"><code>${esc(x.detail)}</code></pre>
                    <small class="code-label">コード例　${esc(x.example)}</small>
                    <pre class="code-block"><code>${esc(x.reading)}</code></pre>
                </article>
            `).join('');
        }
        search.addEventListener('input', render);
        render();
    </script>
</body>
</html>
